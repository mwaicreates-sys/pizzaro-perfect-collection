<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="site-header">
    <div class="header-content">
      <a href="index.html" class="site-title" aria-label="Pizzaro Perfect Home">
        <img src="images/logo-light.png" data-theme-logo data-light-src="images/logo-light.png" data-dark-src="images/logo-dark.png" alt="Pizzaro Perfect Collection" width="160" height="35">

      <nav id="main-navigation" aria-label="Main navigation">
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="inventory.html" class="nav-link" aria-current="page">Shop</a></li>
          <li><a href="location.html" class="nav-link">Stores</a></li>

        </ul>
      </nav>
      <div class="header-tools">
        <button type="button" class="cart-toggle" id="cart-toggle" aria-label="Open cart">

          <span>Cart</span><span id="cart-count" aria-live="polite">0</span>
        </button>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme" aria-pressed="false" title="Switch to dark theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.5A8.5 8.5 0 0 1 8.5 3.6a8.6 8.6 0 1 0 11.9 11.9Z"/></svg>

        <button class="nav-toggle" aria-expanded="false" aria-controls="main-navigation" aria-label="Toggle navigation menu">

        </button>
      </div>
    </div>
  </header>
  <main id="main-content">
    <section class="product-detail-section">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="inventory.html">Shop</a>
          <span aria-hidden="true">/</span>
          <span id="breadcrumb-product">Product details</span>
        </nav>
        <div class="product-detail" id="product-detail" aria-live="polite"></div>
      </div>
    </section>
    <section class="product-detail-delivery">
      <div class="container">
        <p><strong>Delivery countrywide</strong></p>
        <a href="location.html">Find a store <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-section"><h2 data-business-name>Pizzaro Perfect Collection</h2><p data-business-tagline></p><p data-delivery-summary></p></div>
        <div class="footer-section"><h2>Contact</h2><p><a href="" data-business-phone></a></p><p><a href="" data-business-email></a></p><p><a href="" data-contact-whatsapp target="_blank" rel="noopener noreferrer">WhatsApp us</a></p></div>
        <div class="footer-section"><h2>Explore</h2><p><a href="inventory.html">Shop all</a></p><p><a href="location.html">Our stores</a></p></div>

      <div class="footer-bottom">
        <p>&copy; <span data-current-year></span> Pizzaro Perfect Collection. All rights reserved.</p>
        <p class="designer-credit">Designed by Alpha Design Labs</p>

  <script src="js/config.js"></script>
